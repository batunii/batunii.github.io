title: batunii
tagline: "graphics and low level enthusiast"
description: "personal portfolio and blog"
url: ""
baseurl: ""

author:
  name: batunii
  github: "https://github.com/batunii"
  linkedin: "https://linkedin.com/in/batunii"
  email: "sy.soni.edu@gmail.com"

markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate

paginate: 6
paginate_path: "/blog/page:num/"

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
