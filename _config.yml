title: batunii
tagline: "graphics and low level enthusiast"
description: "personal portfolio and blog"
url: ""
baseurl: ""

author:
  name: batunii
  github: "#"
  linkedin: "#"
  twitter: "#"
  email: "hello@example.com"

# Build
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate

paginate: 6
paginate_path: "/blog/page:num/"

# Collections
collections:
  portfolio:
    output: true
    permalink: /portfolio/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: portfolio
    values:
      layout: portfolio_item

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - README.md
